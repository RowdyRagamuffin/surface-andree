name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      - name: Clean and Validate Signing Key
        id: clean_key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.SIGNING_SECRET || secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$RAW_KEY" ]; then
            echo "::error::Neither 'SIGNING_SECRET' nor 'COSIGN_PRIVATE_KEY' is set in GitHub Repository Secrets!"
            exit 1
          fi

          # Strip carriage returns and accidental wrapping quotes
          CLEANED_KEY=$(printf '%s\n' "$RAW_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*["'"']//" -e 's/["'"'][[:space:]]*$//')

          {
            echo "cosign_key<<EOF"
            echo "$CLEANED_KEY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ steps.clean_key.outputs.cosign_key }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
