---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: surface-andree
# description will be included in the image's metadata
description: Custom Universal Blue Fedora Silverblue image tailored for Microsoft Surface Pro 9 (Intel).

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 44 # Active stable Fedora release (HTTP 200 on GHCR)

# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into the root folder /

  # 1. Package management and repositories via dnf/rpm-ostree
  - type: dnf
    repos:
      files:
        - https://pkg.surfacelinux.com/fedora/linux-surface.repo
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        - https://repository.mullvad.net/rpm/stable/mullvad.repo
      copr:
        - atim/starship

  # 2. Kernel swap and Surface Pro 9 driver layer
  - type: rpm-ostree
    remove:
      - kernel
      - kernel-core
      - kernel-modules
      - kernel-modules-extra
      - libwacom
      - libwacom-data
    install:
      - kernel-surface
      - kernel-surface-core
      - kernel-surface-modules
      - kernel-surface-modules-extra
      - iptsd                   # Surface touchscreen/stylus daemon (activated dynamically via udev)
      - libwacom-surface
      - libwacom-surface-data
      - surface-control         # Surface battery and thermal profile CLI
      - tailscale
      - mullvad-vpn             # Official Mullvad VPN client package
      - syncthing               # Syncthing file synchronization

  # 3. CLI and desktop utilities
  - type: dnf
    install:
      packages:
        - micro
        - starship
        - git
        - neovim
        - vlc
    remove:
      packages:
        - firefox
        - firefox-langpacks

  # 4. Hardware and network service daemons
  # Note: iptsd is managed dynamically by udev (iptsd@dev-hidraw*.service) and should NOT be enabled statically.
  - type: systemd
    system:
      enabled:
        - tailscaled.service

  # 5. Flatpak application suites
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.brave.Browser
          - org.gnome.Loupe
          - com.valvesoftware.Steam
          - com.github.tchx84.Flatseal
          - com.discordapp.Discord
          - org.telegram.desktop
          - org.localsend.localsend_app
          - it.mijorus.gearlever
          - com.mattjakeman.ExtensionManager
          - org.libreoffice.LibreOffice
          - com.visualstudio.code
          - io.missioncenter.MissionCenter
          - com.ktechpit.whatsie
          - org.mozilla.thunderbird
          - com.github.wwmm.easyeffects
          - org.keepassxc.KeePassXC
          - us.zoom.Zoom
          - org.jellyfin.JellyfinDesktop
          - com.github.johnfactotum.Foliate
          - com.github.xournalpp.xournalpp
          - net.cozic.joplin_desktop
          - com.jgraph.drawio.desktop
          - io.github.hrkfdn.ncspot
          - app.devsuite.Ptyxis
      - scope: user

  # 6. Cryptographic attestation and signature setup
  - type: signing
